<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK Tracks — Плеер VK Музыки</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1c1c1e;
      padding: 32px;
      border-radius: 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      background: #fa2d48;
      color: #fff;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { color: #8e8e93; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    .btn {
      display: block;
      background: #fa2d48;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 14px;
      border-radius: 16px;
      font-size: 16px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">VK Tracks</div>
    <h1>VK Tracks для Android</h1>
    <p>Музыкальный плеер ВКонтакте в эстетике Apple Music. Без рекламы и подписок. С поддержкой радио, караоке-текстов и офлайн-скачивания.</p>
    <a id="downloadBtn" class="btn" href="https://github.com/ntvampire/vk-tracks/releases/latest">Скачать APK</a>
  </div>
</body>
</html>
